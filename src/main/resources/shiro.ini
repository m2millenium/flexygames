[main]
# Define a JDBC Realm for authentication
jdbcRealm = org.apache.shiro.realm.jdbc.JdbcRealm
jdbcRealm.authenticationQuery = SELECT password_hash FROM uzer WHERE username = ?
jdbcRealm.userRolesQuery = SELECT r.name FROM role r INNER JOIN user_role ur ON r.id = ur.role_id INNER JOIN uzer u ON ur.user_id = u.id WHERE u.username = ?
jdbcRealm.permissionsQuery = SELECT p.name FROM permission p INNER JOIN role_permission rp ON p.id = rp.permission_id INNER JOIN role r ON rp.role_id = r.id INNER JOIN user_role ur ON r.id = ur.role_id INNER JOIN uzer u ON ur.user_id = u.id WHERE u.username = ?

# Set the datasource (H2 database)
dataSource = org.h2.jdbcx.JdbcDataSource
dataSource.serverName = localhost
dataSource.portNumber = 9092
dataSource.databaseName = ./grails-app/conf/db
dataSource.user = sa
jdbcRealm.dataSource = $dataSource

# Configure credentials matcher for SHA-512 hashing
credentialsMatcher = org.apache.shiro.authc.credential.HashedCredentialsMatcher
credentialsMatcher.hashAlgorithmName = SHA-512
credentialsMatcher.storedCredentialsHexEncoded = true
jdbcRealm.credentialsMatcher = $credentialsMatcher

# Set the realm as the default
securityManager.realms = $jdbcRealm

[users]
# Users defined directly (not used since we use JDBC realm)

[roles]
# Roles defined directly (not used since we use JDBC realm)

[urls]
# URLs (not used since authc.required is false)
